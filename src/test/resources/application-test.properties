spring.application.name=nutrition-tracker-test

# Isolated In-Memory H2 Database in MySQL compatibility mode for automated testing
spring.datasource.url=jdbc:h2:mem:nutrition_tracker_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate DDL
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# Disable Flyway during tests so H2 manages schema cleanly via JPA ddl-auto
spring.flyway.enabled=false

# Random port for integration tests
server.port=0

# Open Food Facts API
openfoodfacts.api.url=https://world.openfoodfacts.org/api/v2/product/
openfoodfacts.user-agent=NutritionDietTrackerTest - Version 1.0
