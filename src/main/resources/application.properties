spring.application.name=nutrition-tracker

# MySQL configuration reading DB_PASSWORD from environment variable
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3307/nutrition_tracker?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Server & Session
server.port=8080
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=7d

# Open Food Facts API
openfoodfacts.api.url=https://world.openfoodfacts.org/api/v2/product/
openfoodfacts.user-agent=NutritionDietTracker - SpringBoot - Version 1.0 - www.nutritiontracker.local
