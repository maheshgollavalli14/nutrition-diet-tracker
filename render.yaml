services:
  # 1. Production MySQL 8.0 Database (Render Private Service with Persistent Storage)
  - type: pserv
    name: mysql-db
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/library/mysql:8.0
    envVars:
      - key: MYSQL_DATABASE
        value: nutrition_tracker
      - key: MYSQL_USER
        value: nutrition_user
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 10

  # 2. Backend Web Service (Node.js + Express)
  - type: web
    name: nutrition-tracker-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: OPEN_FOOD_FACTS_BASE_URL
        value: https://world.openfoodfacts.org/api/v2/product/
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: FRONTEND_ORIGIN
        fromService:
          type: web
          name: nutrition-tracker-frontend
          property: url
      # Internal connection to private MySQL service
      - key: DB_HOST
        fromService:
          type: pserv
          name: mysql-db
          property: host
      - key: DB_PORT
        value: "3306"
      - key: DB_USER
        value: nutrition_user
      - key: DB_PASSWORD
        fromService:
          type: pserv
          name: mysql-db
          envVarKey: MYSQL_PASSWORD
      - key: DB_NAME
        value: nutrition_tracker
      - key: DB_SSL
        value: "false"

  # 3. Frontend Static Site (React 18 + Vite)
  - type: web
    name: nutrition-tracker-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: nutrition-tracker-backend
          property: url
